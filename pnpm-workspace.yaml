packages:
  - apps/*
  - packages/*

# Refuse to install/run with a Node.js version outside package.json "engines".
engineStrict: true

# Single source of truth for versions shared across workspace packages.
# Reference with "catalog:" in package.json.
catalog:
  typescript: ~6.0.3
  zod: ^4.6.7
  vitest: ^5.0.4
  "@vitest/coverage-v8": ^5.0.4
  eslint: ^10.12.0
  prettier: ^3.9.10
  "@types/node": ^24.19.2

# pnpm blocks dependency install scripts unless explicitly reviewed.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Install scripts that are not needed at runtime (no-op echo / version check):
  "@google/genai": false
  protobufjs: false

minimumReleaseAgeExclude:
  - "@google/genai@2.29.0"
  - "@hono/node-server@2.1.5"
  - "@testing-library/user-event@14.6.8"
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - "@vitest/coverage-v8@5.0.4"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - lucide-react@1.56.0
  - typescript-eslint@8.71.2
  - vitest@5.0.4
  - zod@4.6.7
